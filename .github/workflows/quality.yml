name: VietFlow quality checks
on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate syntax
        run: python -m compileall -q server.py tests
      - name: Backend unit tests
        run: python -m unittest discover -s tests -v
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate module syntax
        run: node --check dist/workspace-ui.mjs && node --check dist/video-core.mjs && node --check dist/video.js
      - name: Frontend unit tests
        run: node --test tests/video-core.test.mjs
