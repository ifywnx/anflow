name: Verify Supadata live transcript (manual trial)
on:
  pull_request:
    paths:
      - .github/workflows/supadata-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-supadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check one restricted video through deployed ANFLOW API
        run: |
          node --input-type=module <<'NODE'
          const base='https://anflow-hazel.vercel.app/api/supadata-preview?video_id=JGwWNGJdvx8';
          async function request(url){
            const r=await fetch(url,{signal:AbortSignal.timeout(20000)});
            const raw=await r.text();
            let data;
            try{data=JSON.parse(raw);}catch{throw Error('API returned non-JSON HTTP '+r.status+' '+raw.slice(0,90));}
            if(!r.ok)throw Error('API HTTP '+r.status+': '+String(data.detail||'Unknown error').slice(0,180));
            return data;
          }
          let result=await request(base);
          for(let i=0;i<8&&result.pending;i++){
            if(!/^[a-zA-Z0-9_-]{6,128}$/.test(result.job_id))throw Error('Invalid job id');
            await new Promise(resolve=>setTimeout(resolve,2500));
            result=await request(base+'&job_id='+encodeURIComponent(result.job_id));
          }
          if(result.pending)throw Error('Supadata job still pending');
          if(result.source!=='supadata'||!Array.isArray(result.cues)||!result.cues.length)throw Error('No transcript cues returned');
          const valid=result.cues.every(c=>Number.isFinite(c.start)&&Number.isFinite(c.end)&&c.end>c.start&&typeof c.original==='string');
          if(!valid)throw Error('Invalid cue timestamps');
          console.log(JSON.stringify({status:'PASS',source:result.source,lang:result.language,cueCount:result.cues.length,firstTimestamp:result.cues[0].start,lastTimestamp:result.cues.at(-1).end}));
          const translated=await fetch('https://anflow-hazel.vercel.app/api/translate',{
            method:'POST',headers:{'X-VietFlow':'1','Content-Type':'application/json'},
            body:JSON.stringify({texts:['Good morning']}),
            signal:AbortSignal.timeout(18000)
          });
          const textResult=await translated.json();
          if(!translated.ok||!Array.isArray(textResult.translations))throw Error('Translation API failed, HTTP '+translated.status);
          const hasVietnamese=typeof textResult.translations[0]==='string'&&textResult.translations[0].trim().length>0;
          console.log(JSON.stringify({translationHttp:translated.status,hasVietnameseTranslation:hasVietnamese}));
          if(!hasVietnamese)throw Error('Translation service returned empty text; transcript extraction works but translation needs repair');
          NODE
